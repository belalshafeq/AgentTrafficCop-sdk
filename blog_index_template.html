<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | AgentTrafficCop</title>
    <meta name="description" content="Technical articles on AI agent orchestration, preventing infinite loops, and saving API costs.">
    <link rel="alternate" type="application/rss+xml" title="AgentTrafficCop Blog RSS" href="/blog/feed.xml" />
    <style>
        :root { --bg: #000000; --bg-1: #0a0a0a; --fg: #ededed; --fg-1: #a1a1a1; --line: #1f1f1f; --accent: #10b981; }
        body { background: var(--bg); color: var(--fg); font-family: 'Geist', -apple-system, system-ui, sans-serif; line-height: 1.6; padding: 40px 20px; max-width: 800px; margin: 0 auto; }
        a { color: inherit; text-decoration: none; }
        h1 { font-size: 32px; margin-bottom: 40px; letter-spacing: -0.03em; }
        .post-card { display: block; background: var(--bg-1); border: 1px solid var(--line); padding: 24px; border-radius: 8px; margin-bottom: 16px; transition: border-color 0.2s; }
        .post-card:hover { border-color: var(--accent); }
        .post-date { color: var(--fg-1); font-size: 12px; margin-bottom: 8px; text-transform: uppercase; font-family: 'Geist Mono', monospace; }
        .post-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .post-summary { color: var(--fg-1); font-size: 14px; }
    </style>
</head>
<body>
    <a href="/" style="color: var(--fg-1); font-size: 14px;">← Back to Home</a>
    <h1 style="margin-top: 20px;">AgentTrafficCop Blog</h1>
    <div class="posts-list">
        {% for p in posts %}
        <a href="/blog/{{ p.slug }}" class="post-card">
            <div class="post-date">{{ p.date }}</div>
            <h2 class="post-title">{{ p.title }}</h2>
            <p class="post-summary">{{ p.summary }}</p>
        </a>
        {% endfor %}
    </div>
</body>
</html>
